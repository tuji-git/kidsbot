name: Post kids videos

on:
  schedule:
    - cron: "0 */12 * * *"      # every 12 hours (UTC)
  workflow_dispatch:             # manual "Run workflow" button

permissions:
  contents: write                # needed to save history.json

concurrency:
  group: post-videos
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and fonts if missing
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          sudo apt-get install -y fonts-dejavu-core || true

      - run: pip install -r requirements.txt

      - name: Make and upload videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PRIVACY: ${{ vars.PRIVACY || 'private' }}
        run: python main.py

      - name: Save history (also keeps the schedule active)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add history.json || true
          git commit -m "update history" || echo "nothing to commit"
          git push
